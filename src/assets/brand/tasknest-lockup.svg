<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 300" width="1140" height="300" fill="none">
  <defs>
    <!-- Orange Sun Gradient -->
    <linearGradient id="sunGrad" x1="115" y1="55" x2="225" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFAE34" />
      <stop offset="55%" stop-color="#FD9414" />
      <stop offset="100%" stop-color="#F57600" />
    </linearGradient>

    <!-- Orange Rays Gradient -->
    <linearGradient id="rayGrad" x1="235" y1="20" x2="295" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9C1E" />
      <stop offset="100%" stop-color="#F57A00" />
    </linearGradient>

    <!-- Main Left Nest Upper Wave Gradient -->
    <linearGradient id="nestLeftUpper" x1="26" y1="132" x2="245" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B29D" />
      <stop offset="50%" stop-color="#01867B" />
      <stop offset="100%" stop-color="#005B5E" />
    </linearGradient>

    <!-- Main Left Nest Lower Basin Shading Gradient -->
    <linearGradient id="nestLeftLower" x1="45" y1="185" x2="268" y2="275" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#016E6A" />
      <stop offset="55%" stop-color="#005258" />
      <stop offset="100%" stop-color="#003A40" />
    </linearGradient>

    <!-- Right Inner Nest Leaf Gradient -->
    <linearGradient id="nestRightGrad" x1="185" y1="205" x2="305" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E9184" />
      <stop offset="55%" stop-color="#01716C" />
      <stop offset="100%" stop-color="#005053" />
    </linearGradient>

    <!-- Right Inner Nest Lower Rim Shading -->
