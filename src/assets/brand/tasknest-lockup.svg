      <stop offset="0%" stop-color="#047D74" />
      <stop offset="100%" stop-color="#00484B" />
    </linearGradient>

    <!-- Wordmark "Nest" Orange Gradient -->
    <linearGradient id="nestTextGrad" x1="742" y1="95" x2="1110" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF981A" />
      <stop offset="50%" stop-color="#FD8B09" />
      <stop offset="100%" stop-color="#F47400" />
    </linearGradient>
  </defs>

