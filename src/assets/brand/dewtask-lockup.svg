<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 160" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .wordmark {
        font-family: 'Inter Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 88px;
        letter-spacing: 0em;
        font-kerning: normal;
        text-rendering: geometricPrecision;
        font-feature-settings: "kern" 1, "calt" 1, "ss03" 1, "cv11" 1;
        font-optical-sizing: auto;
      }
      .dew  { font-weight: 700; letter-spacing: 0.07em;}
      .task { font-weight: 700; letter-spacing: 0.08em; }
    </style>
    <linearGradient id="dropGrad" x1="35%" y1="5%" x2="70%" y2="85%">
      <stop offset="0%" stop-color="#35C2FF" />
      <stop offset="45%" stop-color="#1582EB" />
      <stop offset="100%" stop-color="#054AB8" />
    </linearGradient>
    <linearGradient id="dropHighlight" x1="20%" y1="15%" x2="60%" y2="75%">
      <stop offset="0%" stop-color="#60D4FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1582EB" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="leftLeafGrad" x1="15%" y1="20%" x2="75%" y2="95%">
      <stop offset="0%" stop-color="#22E4AC" />
      <stop offset="55%" stop-color="#14C696" />
      <stop offset="100%" stop-color="#0A8E7A" />
    </linearGradient>
    <linearGradient id="leafTopGrad" x1="0%" y1="60%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#3AE879" />
      <stop offset="100%" stop-color="#20C963" />
    </linearGradient>
    <linearGradient id="leafBotGrad" x1="10%" y1="90%" x2="95%" y2="25%">
      <stop offset="0%" stop-color="#0D9F56" />
      <stop offset="50%" stop-color="#14B863" />
      <stop offset="100%" stop-color="#19C66B" />
    </linearGradient>
    <!-- Deep navy "Dew": lighter weight, the quiet half -->
    <linearGradient id="dewGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3556" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
    <!-- Royal blue "Task": heavier weight, diagonal gradient echoing the drop -->
    <linearGradient id="taskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A70E0" />
      <stop offset="100%" stop-color="#0A459E" />
    </linearGradient>
    <filter id="checkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#033180" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Icon: scaled to 0.7 (≈1.64x cap height), vertical centre locked to cap-height midpoint (y=80) -->
  <g transform="translate(-24.3, 14) scale(0.7)">
    <path d="M 65 65 C 51 86, 46 105, 49 124 C 52 142, 65 157, 79 164 C 82 155, 87 146, 94 139 C 71 128, 60 109, 60 87 C 60 79, 62 72, 65 65 Z" fill="url(#leftLeafGrad)" />
    <path d="M 65 65 C 60 85, 62 118, 94 139 C 96 137, 98 135, 100 133 C 68 114, 64 85, 68 61 Z" fill="#076A85" opacity="0.35" />
    <path d="M 97 22 C 99 19.5, 101 19.5, 103 22 C 118 40, 152 77, 152 108 C 152 110, 151.8 111.5, 151.5 113 C 134 117, 108 124, 94 139 C 66 123, 59 97, 65 65 C 74 50, 87 34, 97 22 Z" fill="url(#dropGrad)" />
    <path d="M 98 25 C 85 42, 70 65, 69 91 C 68 110, 77 123, 91 132 C 81 120, 77 105, 79 88 C 81 66, 91 43, 100 25 Z" fill="url(#dropHighlight)" />
    <path d="M 85 165 C 96 138, 120 123, 154 117 C 135 135, 112 153, 85 165 Z" fill="url(#leafTopGrad)" />
    <path d="M 85 165 C 112 153, 135 135, 154 117 C 152 146, 132 169, 103 169 C 96 169, 90 167.5, 85 165 Z" fill="url(#leafBotGrad)" />
    <path d="M 85 99 L 96.5 110.5 L 121.5 85.5" fill="none" stroke="#FFFFFF" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#checkShadow)" />
  </g>

  <!-- Wordmark: cap-height centred on the icon's optical centre (y≈80), weight contrast Dew 600 / Task 800 -->
  <text x="100" y="112" class="wordmark">
    <tspan class="dew" fill="url(#dewGrad)">Dew</tspan><tspan class="task" dx="-2" fill="url(#taskGrad)">Task</tspan>
  </text>
</svg>