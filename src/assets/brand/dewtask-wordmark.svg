<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 100" width="100%" height="100%">
  <defs>
    <style>
      .wordmark {
        font-family: 'Inter Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 88px;
        letter-spacing: 0em;
        font-kerning: normal;
        text-rendering: geometricPrecision;
        font-feature-settings: "kern" 1, "calt" 1, "ss03" 1, "cv11" 1;
        font-optical-sizing: auto;
      }
      .dew  { font-weight: 700; letter-spacing: 0.07em;}
      .task { font-weight: 700; letter-spacing: 0.08em; }
    </style>
    <linearGradient id="dewGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162E4D" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
    <linearGradient id="taskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1463CF" />
      <stop offset="100%" stop-color="#0A459E" />
    </linearGradient>
  </defs>

  <text x="12" y="77" class="wordmark">
    <tspan fill="url(#dewGrad)">Dew</tspan><tspan fill="url(#taskGrad)">Task</tspan>
  </text>
</svg>